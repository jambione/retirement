# Add this hostname to the tunnel that already serves trading.jbrasfield.com.
# You do NOT need a second tunnel -- one tunnel fans out to many hostnames, and
# a second one would mean a second cloudflared process competing for the same
# credentials file.
#
# Merge the `retirement` block into ~/.cloudflared/config.yml on the mini so it
# ends up looking like this. Order matters: the catch-all 404 must stay last.

tunnel: 56c84116-0ef0-47c7-bbea-25634d765487
credentials-file: /Users/jambimac/.cloudflared/56c84116-0ef0-47c7-bbea-25634d765487.json

ingress:
  - hostname: trading.jbrasfield.com
    service: http://localhost:8888

  - hostname: retirement.jbrasfield.com
    service: http://localhost:8891

  - service: http_status:404
